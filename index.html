<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavras Mágicas - Instalar App</title>
    
    <!-- Nomes exatos dos arquivos que estão no seu GitHub -->
    <link rel="manifest" href="./manifesto.webmanifest">
    <meta name="theme-color" content="#121212">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container principal mantendo a proporção exata 9:16 da imagem */
        .app-container {
            width: 100%;
            max-width: 414px;
            aspect-ratio: 9 / 16;
            max-height: 100vh;
            background-image: url('https://i.postimg.cc/bNP7qs6Q/Gemini-Generated-Image-mk5whqmk5whqmk5w.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Posicionamento exato em cima da pílula azul da imagem */
        .pill-slot {
            position: absolute;
            top: 62.3%; /* Altura exata do botão azul na arte */
            left: 5.5%;
            width: 89%;
            height: 6.2%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Estilo unificado para preencher a pílula azul perfeitamente */
        .action-btn {
            width: 100%;
            height: 100%;
            border-radius: 999px;
            border: none;
            background-color: #A8C7FA; /* Mesmo tom azul claro da Google Play na imagem */
            color: #041E49; /* Azul escuro para contraste nativo */
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .action-btn:active {
            transform: scale(0.97);
            filter: brightness(0.92);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Espaço exato do botão azul -->
        <div class="pill-slot">
            <!-- O botão fica disponível mesmo antes de o navegador liberar o prompt. -->
            <button id="btn-install" class="action-btn">
                Instalar
            </button>

            <!-- Botão padrão para abrir o jogo caso já esteja instalado ou no navegador -->
            <a id="btn-play" href="./jogo.html" class="action-btn" style="display: none;">
                Jogar Agora
            </a>
        </div>
    </div>

    <script>
        // Registrando o service-worker.js com o nome exato do seu repositório
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((reg) => console.log('Service Worker ativo:', reg.scope))
                    .catch((err) => console.log('Erro no Service Worker:', err));
            });
        }

        let deferredPrompt;
        const btnInstall = document.getElementById('btn-install');
        const btnPlay = document.getElementById('btn-play');

        // O navegador só oferece a instalação nativa quando todos os requisitos do PWA
        // forem atendidos. Guardamos o evento para usá-lo após o clique do usuário.
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // Ação de clique no botão Instalar
        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                if (outcome === 'accepted') {
                    btnInstall.style.display = 'none';
                    btnPlay.style.display = 'flex';
                }
                return;
            }

            // Safari no iPhone/iPad não dispara beforeinstallprompt. Em outros
            // navegadores, a ausência do evento normalmente indica um requisito pendente.
            const isAppleMobile = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isAppleMobile) {
                alert('Para instalar: toque em Compartilhar e escolha “Adicionar à Tela de Início”.');
            } else if (!window.isSecureContext) {
                alert('A instalação exige uma página HTTPS (ou localhost durante o desenvolvimento).');
            } else {
                alert('Este navegador ainda não liberou a instalação. Confira se o manifesto e o service worker estão acessíveis e válidos, e tente pelo Chrome ou Edge.');
            }
        });

        // Se o app já estiver instalado e rodando em modo standalone, muda o texto
        window.addEventListener('appinstalled', () => {
            btnInstall.style.display = 'none';
            btnPlay.style.display = 'flex';
        });

        // Se a página já estiver instalada, mostra diretamente a ação de abrir.
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
            btnInstall.style.display = 'none';
            btnPlay.style.display = 'flex';
        }
    </script>
</body>
</html>
