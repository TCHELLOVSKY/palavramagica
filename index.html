<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavras Mágicas - Instalar App</title>
    
    <!-- Link do PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4CAF50">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* Container principal simulando a proporção 9:16 do celular */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-image: url('https://i.postimg.cc/bNP7qs6Q/Gemini-Generated-Image-mk5whqmk5whqmk5w.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 50px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Camada para escurecer levemente a parte inferior se precisar de contraste */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            z-index: 1;
        }

        /* Estilo do container do botão de instalação */
        #install-container {
            position: relative;
            z-index: 2;
            width: 90%;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Botão personalizado de instalação */
        #btn-install {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 16px 28px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            width: 100%;
            transition: transform 0.2s ease, background 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #btn-install:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="overlay"></div>
        
        <!-- Botão que ativa a instalação do PWA -->
        <div id="install-container" style="display: none;">
            <button id="btn-install">
                Instalar o App Agora 🚀
            </button>
        </div>
    </div>

    <!-- Script PWA e Lógica de Instalação -->
    <script>
        // Registrar o Service Worker (Essencial para o PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registrado com sucesso:', reg.scope))
                    .catch((err) => console.log('Falha ao registrar o Service Worker:', err));
            });
        }

        let deferredPrompt;

        // Escuta o evento do navegador que avisa que o PWA pode ser instalado
        window.addEventListener('beforeinstallprompt', (e) => {
            // Impede que o banner nativo padrão apareça automaticamente
            e.preventDefault();
            
            // Guarda o evento para usar depois
            deferredPrompt = e;
            
            // Mostra o seu botão personalizado na tela
            const installContainer = document.getElementById('install-container');
            if (installContainer) {
                installContainer.style.display = 'block';
            }
        });

        // Quando o usuário clicar no seu botão central
        const btnInstall = document.getElementById('btn-install');
        if (btnInstall) {
            btnInstall.addEventListener('click', async () => {
                if (deferredPrompt) {
                    // Mostra o prompt de instalação nativo do Android
                    deferredPrompt.prompt();
                    
                    // Espera para ver o que o usuário escolheu
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('Usuário aceitou instalar o app');
                    } else {
                        console.log('Usuário recusou a instalação');
                    }
                    
                    // O prompt só pode ser usado uma vez, limpamos a variável
                    deferredPrompt = null;
                    
                    // Esconde o botão após a ação
                    document.getElementById('install-container').style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
